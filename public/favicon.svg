<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c3461" />
      <stop offset="50%" stop-color="#162a50" />
      <stop offset="100%" stop-color="#0c172d" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e57824" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2f5fb0" stroke-width="1.5" />

  <!-- Document Sheet -->
  <path d="M18 14 C18 12.8954 18.8954 12 20 12 H36 L46 22 V50 C46 51.1046 45.1046 52 44 52 H20 C18.8954 52 18 51.1046 18 50 Z" 
        fill="url(#docGrad)" 
        stroke="#2f5fb0" 
        stroke-width="1" />

  <!-- Document Folded Corner -->
  <path d="M36 12 V22 H46 Z" fill="#2f5fb0" opacity="0.4" />
  
  <!-- Document Content Lines -->
  <line x1="24" y1="26" x2="33" y2="26" stroke="#1c3461" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="32" x2="38" y2="32" stroke="#1c3461" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="24" y1="38" x2="35" y2="38" stroke="#1c3461" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- AI Intelligence Star / Sparkle in Warm Orange -->
  <g transform="translate(40, 38)" filter="url(#glow)">
    <path d="M0 -11 C0 -4 4 0 11 0 C4 0 0 4 0 11 C0 4 -4 0 -11 0 C-4 0 0 -4 0 -11 Z" fill="url(#sparkGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#fff" />
  </g>
</svg>

